name: Python package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Test

    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.14.2"]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_tests.txt
    - name: Lint with flake8
      run: |
        python -m flake8 custom_components/resilio_backup/ tests/
    - name: Lint with pylint
      run: |
        python -m pylint --rcfile=pyproject.toml custom_components/resilio_backup/ tests/
    - name: Test with pytest
      run: |
        python -m pytest --cov --cov-report term-missing --cov-config=pyproject.toml
    - name: Coveralls
      # Coveralls' GitHub-token flow needs a public repo; this one is
      # private for now, so submission 422s. Non-blocking until it's public.
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        coveralls

  zizmor:
    name: Run zizmor 🌈

    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Run zizmor 🌈
      uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
      with:
        persona: pedantic
        advanced-security: false

  resilio-capture:
    name: Resilio Sync API capture (docker)

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.14.2"
    - name: Install capture script dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tools/resilio_capture/requirements.txt
    - name: Start Resilio Sync containers
      working-directory: tools/resilio_capture
      run: docker compose up -d
    - name: Capture and verify Resilio API shape
      # Drives two unlicensed resilio/sync containers through the same
      # `/gui/` action API custom_components/resilio_backup/api.py uses, then
      # runs the real folder_state.derive_sync_state against what comes
      # back. Fails the build if Resilio drops/renames a field
      # coordinator.py depends on for sync_state (lowlysre/ha-backup-resilio#9).
      run: python tools/resilio_capture/capture.py
    - name: Dump container logs
      if: failure()
      working-directory: tools/resilio_capture
      run: docker compose logs
    - name: Stop containers
      if: always()
      working-directory: tools/resilio_capture
      run: docker compose down -v

  are-we-good:
    name: Are we good?

    runs-on: ubuntu-latest
    needs: [ build, zizmor, resilio-capture ]
    if: always()
    permissions: {}
    steps:
    - name: Aggregate check status
      uses: lowlydba/are-we-good@f506ed6324f55ec5e4ff5d92204a72c7f1c2b4f8 # v1.0.5
      with:
        jobs: ${{ toJSON(needs) }}
