name: Python package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Test

    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.14.2"]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_tests.txt
    - name: Lint with flake8
      run: |
        python -m flake8 custom_components/resilio_backup/ resilio_client/ tests/
    - name: Lint with pylint
      run: |
        python -m pylint --rcfile=pyproject.toml custom_components/resilio_backup/ resilio_client/ tests/
    - name: Test with pytest
      run: |
        python -m pytest --cov --cov-report term-missing --cov-config=pyproject.toml
    - name: Coveralls
      # Coveralls' GitHub-token flow needs a public repo; this one is
      # private for now, so submission 422s. Non-blocking until it's public.
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        coveralls

  zizmor:
    name: Run zizmor 🌈

    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Run zizmor 🌈
      uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
      with:
        persona: pedantic
        advanced-security: false

  resilio-capture:
    name: Resilio Sync API capture (docker)

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.14.2"
    - name: Install capture script dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tools/resilio_capture/requirements.txt
    - name: Start Resilio Sync containers
      working-directory: tools/resilio_capture
      run: docker compose up -d
    - name: Capture and verify Resilio API shape
      # Drives two unlicensed resilio/sync containers through the same
      # `/gui/` action API custom_components/resilio_backup/api.py uses, then
      # runs the real folder_state.derive_sync_state against what comes
      # back. Fails the build if Resilio drops/renames a field
      # coordinator.py depends on for sync_state (lowlysre/ha-backup-resilio#9).
      run: python tools/resilio_capture/capture.py
    - name: Dump container logs
      if: failure()
      working-directory: tools/resilio_capture
      run: docker compose logs
    - name: Stop containers
      if: always()
      working-directory: tools/resilio_capture
      run: docker compose down -v

  resilio-client-e2e:
    name: resilio-client CLI E2E (docker, resilio/sync:${{ matrix.resilio_version }})

    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Run every pinned version even if one fails, so a single bad release
      # doesn't hide drift in the others.
      fail-fast: false
      matrix:
        # Small, deliberate spread of resilio/sync tags: the current stable
        # release plus a couple of older widely-deployed releases, so a
        # WebUI API change in one version doesn't silently slip past CI.
        resilio_version: ["2.8.1", "2.7.3", "2.7.2"]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.14.2"
    - name: Install resilio-client
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    - name: Start a Resilio Sync container
      working-directory: tools/cli_e2e
      env:
        RESILIO_IMAGE_TAG: ${{ matrix.resilio_version }}
      run: docker compose up -d
    - name: Run resilio-client CLI E2E flow
      # The container can accept TCP connections before rslsync has finished
      # agreeing to the EULA and initializing, so the first few `status`
      # calls can fail even though the port is already open; retry a few
      # times before trusting a connection failure (see tools/cli_e2e/README.md).
      env:
        RESILIO_ARGS: --host 127.0.0.1 --port 8888 --username admin --password cli-e2e-secret
      run: |
        set -e
        ready=false
        for i in $(seq 1 30); do
          if resilio-client status $RESILIO_ARGS; then
            ready=true
            break
          fi
          echo "Resilio Sync not ready yet, retrying ($i/30)..."
          sleep 2
        done
        if [ "$ready" != "true" ]; then
          echo "Resilio Sync container never became ready" >&2
          exit 1
        fi
        resilio-client folders $RESILIO_ARGS
        resilio-client add-folder $RESILIO_ARGS --path /mnt/sync/folders/e2e
        resilio-client folders $RESILIO_ARGS | grep -q /mnt/sync/folders/e2e
    - name: Dump container logs
      if: failure()
      working-directory: tools/cli_e2e
      run: docker compose logs
    - name: Stop container
      if: always()
      working-directory: tools/cli_e2e
      run: docker compose down -v

  backup-store-e2e:
    name: resilio-backup-store CLI E2E (docker)

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.14.2"
    - name: Install resilio-backup-store
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    - name: Start a Resilio Sync container
      working-directory: tools/backup_store_e2e
      run: |
        mkdir -p data
        chmod 777 data
        docker compose up -d
    - name: Run resilio-backup-store CLI E2E flow
      # See tools/cli_e2e's equivalent step: the container can accept TCP
      # connections before rslsync has finished initializing, so retry a few
      # times before trusting a connection failure.
      env:
        RESILIO_ARGS: --host 127.0.0.1 --port 8889 --username admin --password backup-store-e2e-secret
        BACKUP_PATH: tools/backup_store_e2e/data/folders/backups
      run: |
        set -e
        ready=false
        for i in $(seq 1 30); do
          if resilio-client status $RESILIO_ARGS; then
            ready=true
            break
          fi
          echo "Resilio Sync not ready yet, retrying ($i/30)..."
          sleep 2
        done
        if [ "$ready" != "true" ]; then
          echo "Resilio Sync container never became ready" >&2
          exit 1
        fi

        resilio-client add-folder $RESILIO_ARGS --path /mnt/sync/folders/backups
        resilio-client folders $RESILIO_ARGS | grep -q /mnt/sync/folders/backups

        # rslsync runs as root in the container, so the backups directory it
        # just created under the bind mount is root-owned; reclaim it so the
        # runner user can write backup files into it.
        sudo chmod -R a+rwX "$(dirname "$BACKUP_PATH")"

        echo -n "hello" > archive.tar
        resilio-backup-store create --backup-path "$BACKUP_PATH" --backup-id b1 \
          --metadata '{"date": "2026-08-30T23:00:00+00:00"}' --input archive.tar
        resilio-backup-store list --backup-path "$BACKUP_PATH" | grep -q '"backup_id": "b1"'
        resilio-backup-store restore --backup-path "$BACKUP_PATH" --backup-id b1 --output restored.tar
        cmp archive.tar restored.tar

        resilio-backup-store create --backup-path "$BACKUP_PATH" --backup-id b2 \
          --metadata '{"date": "2026-08-30T23:10:00+00:00"}' --input archive.tar
        resilio-backup-store prune --backup-path "$BACKUP_PATH" --max-backups 1 | grep -q '"b1"'
        resilio-backup-store list --backup-path "$BACKUP_PATH" | grep -q '"backup_id": "b2"'

        resilio-backup-store delete --backup-path "$BACKUP_PATH" --backup-id b2
        [ "$(resilio-backup-store list --backup-path "$BACKUP_PATH")" = "[]" ]
    - name: Dump container logs
      if: failure()
      working-directory: tools/backup_store_e2e
      run: docker compose logs
    - name: Stop container
      if: always()
      working-directory: tools/backup_store_e2e
      run: docker compose down -v

  are-we-good:
    name: Are we good?

    runs-on: ubuntu-latest
    needs: [ build, zizmor, resilio-capture, resilio-client-e2e, backup-store-e2e ]
    if: always()
    permissions: {}
    steps:
    - name: Aggregate check status
      uses: lowlydba/are-we-good@f506ed6324f55ec5e4ff5d92204a72c7f1c2b4f8 # v1.0.5
      with:
        jobs: ${{ toJSON(needs) }}
